<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Microjob BD</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirect
      // Path segment count for repository root: /microjob-bd/ -> segment count is 1
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' : '') +
        l.search.slice(1).replace(/&/g, '~and~') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
